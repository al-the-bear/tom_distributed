# yaml-language-server: $schema=../../../../../../../.tom/json-schema/buildkit/buildkit.schema.json
# buildkit configuration of tom_dist_ledger_tool

project_id: DL
name: distledger
description: >-
  Ledger CLI tool.
license: BSD-3-Clause

# Compiler: the binary into the binaries layer ($TOM_BINARY_PATH/<platform>/).
versioner:
  variable-prefix: DistLedgerTool

compiler:
  # The release executables (tom_binaries/tom/<platform>/; buildkit :skill-build-binaries --list).
  executables:
    ledger_server: {release: true}
  compiles:
    # macOS ARM64 - compile for self; with --all-platforms also linux-x64
    - pipeline:
        - shell mkdir -p $TOM_BINARY_PATH/%{target-platform-vs}
        - shell dart compile exe %{file} --target-os=%{dart-target-os} --target-arch=%{dart-target-arch} -o $TOM_BINARY_PATH/%{target-platform-vs}/ledger_server
      files: bin/ledger_server.dart
      targets: [darwin-arm64, linux-x64]
      platforms: [darwin-arm64]

    # Unix-like platforms - compile for self only
    - pipeline:
        - shell mkdir -p $TOM_BINARY_PATH/%{target-platform-vs}
        - shell dart compile exe %{file} --target-os=%{dart-target-os} --target-arch=%{dart-target-arch} -o $TOM_BINARY_PATH/%{target-platform-vs}/ledger_server
      files: bin/ledger_server.dart
      platforms: [darwin-x64, linux-*]

    # Windows - compile for self only
    - pipeline:
        - shell dart compile exe %{file} --target-os=%{dart-target-os} --target-arch=%{dart-target-arch} -o $TOM_BINARY_PATH/win32-x64/ledger_server.exe
      files: bin/ledger_server.dart
      platforms: [win32-*]

  postcompile:
    - pipeline:
        - shell chmod -R +x $TOM_BINARY_PATH/%{current-platform-vs}/
      platforms: [macos, linux]
