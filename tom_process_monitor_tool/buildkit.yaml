# buildkit configuration of tom_process_monitor_tool

project_id: PMT
name: processmonitor
description: >-
  Process monitor CLI.
license: BSD-3-Clause

# Compiler: the binary into the binaries layer ($TOM_BINARY_PATH/<platform>/).
compiler:
  compiles:
    # macOS ARM64 - compile for self; with --all-platforms also linux-x64
    - pipeline:
        - shell mkdir -p $TOM_BINARY_PATH/%{target-platform-vs}
        - shell dart compile exe %{file} --target-os=%{dart-target-os} --target-arch=%{dart-target-arch} -o $TOM_BINARY_PATH/%{target-platform-vs}/process_monitor
      files: bin/process_monitor.dart
      targets: [darwin-arm64, linux-x64]
      platforms: [darwin-arm64]

    # Unix-like platforms - compile for self only
    - pipeline:
        - shell mkdir -p $TOM_BINARY_PATH/%{target-platform-vs}
        - shell dart compile exe %{file} --target-os=%{dart-target-os} --target-arch=%{dart-target-arch} -o $TOM_BINARY_PATH/%{target-platform-vs}/process_monitor
      files: bin/process_monitor.dart
      platforms: [darwin-x64, linux-*]

    # Windows - compile for self only
    - pipeline:
        - shell dart compile exe %{file} --target-os=%{dart-target-os} --target-arch=%{dart-target-arch} -o $TOM_BINARY_PATH/win32-x64/process_monitor.exe
      files: bin/process_monitor.dart
      platforms: [win32-*]

  postcompile:
    - pipeline:
        - shell chmod -R +x $TOM_BINARY_PATH/%{current-platform-vs}/
      platforms: [macos, linux]
